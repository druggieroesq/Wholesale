name: Scheduled Wholesale Catalog Watcher

on:
  schedule:
    # Runs at 12:00, 17:00, 22:00 UTC (8:00 AM, 1:00 PM, 6:00 PM Eastern Standard Time)
    - cron: '0 12,17,22 * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI

permissions:
  contents: write

jobs:
  run-catalog-sniper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Catalog Engine & Send Alerts
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISTRIBUTOR_EMAIL_USER: ${{ secrets.DISTRIBUTOR_EMAIL_USER }}
          DISTRIBUTOR_EMAIL_PASS: ${{ secrets.DISTRIBUTOR_EMAIL_PASS }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER || 'imap.gmail.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
        run: |
          python main.py --auto

      - name: Persist Data Back to GitHub
        run: |
          git config --global user.name "Wholesale Bot [Automated]"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore(auto): update POs and state registries [skip ci]" && git push origin main)
