name: Scheduled Wholesale Catalog Watcher

on:
  schedule:
    # Runs at 12:00, 17:00, 22:00 UTC (8:00 AM, 1:00 PM, 6:00 PM Eastern Standard Time)
    - cron: '0 12,17,22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-catalog-sniper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Catalog Engine
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISTRIBUTOR_EMAIL_USER: ${{ secrets.DISTRIBUTOR_EMAIL_USER }}
          DISTRIBUTOR_EMAIL_PASS: ${{ secrets.DISTRIBUTOR_EMAIL_PASS }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER || 'imap.gmail.com' }}
          DISTRIBUTOR_MOQ: 3000.00
          MIN_BRAND_UNITS: 12
        run: |
          python main.py --auto

      - name: Commit and push generated Purchase Orders & State
        run: |
          git config --global user.name "Wholesale Bot [Automated]"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/output/ data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update purchase orders & ungated registry [skip ci]" && git push)
